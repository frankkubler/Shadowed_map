# Déploiement de Shadowed Map : un seul conteneur, qui sert le bundle statique.
#
#   docker compose up -d --build
#
# La clé CARTO est lue dans le fichier .env de ce dossier (déjà ignoré par git),
# sous le nom CARTO_BASEMAPS_API_KEY. Sans elle, le site fonctionne mais les
# fonds clair et sombre reviennent filigranés.

services:
  web:
    build:
      context: .
      args:
        # Résolue au build : le site est statique, la valeur finit dans le
        # bundle livré au navigateur (voir le commentaire du Dockerfile).
        CARTO_BASEMAPS_API_KEY: ${CARTO_BASEMAPS_API_KEY:-}
        # Le site est servi à la racine du conteneur. À passer à /shadows/ (avec
        # les deux slashes) si le reverse proxy l'expose sous un sous-chemin
        # sans le retirer de l'URL transmise.
        BASE_PATH: ${BASE_PATH:-/}
    image: shadowed-map:local
    restart: unless-stopped

    # Le service est atteint par le reverse proxy, jamais directement : par
    # défaut on n'écoute donc que sur la loopback.
    #   - proxy sur le même hôte      → laisser 127.0.0.1
    #   - proxy sur un autre pair     → BIND_ADDR = l'adresse NetBird de cet
    #     hôte (interface wt0, 100.x.y.z), pour rester hors des interfaces
    #     publiques
    #   - proxy en conteneur          → supprimer ce bloc `ports` et passer par
    #     le réseau partagé ci-dessous, le proxy joignant alors `web:80`
    ports:
      - '${BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-8080}:80'

    # Rien à écrire sur le disque : le bundle et la configuration sont dans
    # l'image, les logs partent sur stdout/stderr. Les tmpfs couvrent les seuls
    # chemins que nginx doit pouvoir écrire — son pid et ses tampons de
    # requête, que le processus maître recrée au démarrage.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # nginx démarre en root pour lier le port 80 puis bascule ses workers sur
      # l'utilisateur nginx : seules ces deux capacités lui restent utiles.
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE

    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', '--tries=1', 'http://127.0.0.1/']
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

# Si le reverse proxy tourne lui aussi en conteneur, le joindre par un réseau
# commun évite de publier le moindre port sur l'hôte. Créer le réseau une fois
# (`docker network create proxy`), puis décommenter ici et rattacher le service
# via `networks: [proxy]`.
# networks:
#   proxy:
#     external: true
