name: Déploiement GitHub Pages

# Le déploiement n'est pas automatique : il faut d'abord activer Pages dans les
# réglages du dépôt (Settings → Pages → Source : GitHub Actions). Tant que ce n'est
# pas fait, ce workflow échouerait à chaque push, d'où le déclenchement manuel.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
