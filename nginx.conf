# Service du bundle statique produit par `vite build`.
#
# Ce conteneur est destiné à tourner derrière un reverse proxy (exposition via
# NetBird) : la terminaison TLS, les redirections http→https et HSTS sont du
# ressort de l'amont. Les poser ici aussi enverrait une redirection vers une
# adresse que ce conteneur ne connaît pas, ou un HSTS sur un nom qu'il n'a pas.
#
# Ce fichier est inclus dans le contexte `http` : `log_format` et `map`, qui
# n'ont pas le droit d'apparaître dans un bloc `server`, sont donc ici à la
# racine, avant lui.

# Le client réel est derrière le proxy : sans cette trace, tous les accès
# apparaissent sous l'IP du proxy. On journalise l'en-tête tel quel plutôt que
# de réécrire $remote_addr via real_ip, ce qui demanderait de figer ici
# l'adresse du proxy.
log_format avec_proxy '$remote_addr forwarded_for="$http_x_forwarded_for" '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';

# Vite empreinte le nom des fichiers de dist/assets/ : leur contenu ne change
# jamais sous un même nom, d'où le cache long. Tout le reste — index.html en
# premier lieu, qui porte les références vers ces noms — doit être revalidé à
# chaque visite, sinon un déploiement ne se voit qu'après vidage du cache
# navigateur.
#
# Le choix passe par une variable, et non par un `add_header` dans une
# `location` dédiée : dès qu'une `location` pose son propre `add_header`, nginx
# cesse d'hériter de ceux du `server`, et les en-têtes de sécurité ci-dessous
# disparaîtraient silencieusement sur les fichiers concernés. `always` n'y
# change rien : la règle porte sur le niveau, pas sur le code de réponse.
map $uri $cache_control {
    default    "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log avec_proxy;

    # Le site appelle des API externes (IGN, AWS terrain tiles, Overpass,
    # Nominatim, CARTO) et lit des tuiles dans des textures WebGL : pas de
    # requête vers ce serveur au-delà des fichiers du bundle.
    #
    # `frame-ancestors 'none'` remplace X-Frame-Options, que les navigateurs
    # actuels n'utilisent plus quand une CSP est présente.
    #
    # `connect-src` n'autorise que https : le miroir local de tuiles du README
    # (`?dem=http://127.0.0.1:5180`), utile sur un réseau sans accès direct aux
    # services d'élévation, serait refusé. L'ajouter explicitement à
    # `connect-src` dans ce cas, plutôt que d'ouvrir `http:` en entier.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self' blob:; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $cache_control always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css text/plain application/javascript application/json
               application/wasm image/svg+xml application/geo+json;

    location /assets/ {
        access_log off;
        try_files $uri =404;
    }

    # `build.sourcemap` est à true dans vite.config.ts : les .map sont donc
    # dans dist/. Ils ne servent qu'au débogage et exposent les sources ;
    # décommenter pour les refuser sans toucher au reste du build.
    # location ~ \.map$ {
    #     return 404;
    # }

    # Pas de repli vers index.html : l'état de la vue vit dans le fragment
    # d'URL (src/state/appState.ts), qui n'est jamais envoyé au serveur. Aucune
    # route profonde à réécrire, donc un chemin inconnu est une vraie erreur et
    # doit se voir comme telle.
    location / {
        try_files $uri $uri/ =404;
    }
}
